# Repo-boundary tests: no Docker, no emulator, no product.
#
# THE PIPELINE IS NOT RUN HERE. That needs the emulator, four vendors and an
# Airflow stack, and it is `make verify` against a checked-out product.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Repo tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # uv AND A LOCK, like every other platform in the family. `pip install
      # pytest ruff` resolved the tooling fresh on every run, so what the gate
      # rejects was decided by ruff's release calendar rather than by anything
      # in this repository -- 0.16 promoted ISC and FURB into the default rule
      # set and the job went red on a branch nobody had touched.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.3"
      # The Windows runner ships no make, and `make test`/`make lint` are how
      # the boundary tests are invoked -- here and by anyone developing on it.
      - if: matrix.os == 'windows-latest'
        run: choco install make --no-progress -y
        working-directory: ${{ github.workspace }}
      - run: uv sync --frozen --group dev
      - run: make test
      - run: make lint
      # ruff was configured in pyproject.toml and never run, so the config
      # described an intention rather than a guarantee.
      - name: ruff
        run: uvx ruff@0.15.22 check .
      # A shell script that cannot be parsed fails at container start, where
      # the error is buried in `docker compose logs` rather than reported here.
      - name: start.sh parses
        run: bash -n scripts/start.sh
      # THE COMPOSE FILE IS THE PLATFORM. A typo in it is not caught by any
      # test above, and it surfaces as a stack that will not come up.
      - name: docker compose config is valid
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p /tmp/p/dags /tmp/src
          printf 'version: 1\nvendors: []\n' > /tmp/src/sources.yaml
          printf '{"services":{}}' > .sources.generated.yml
          PRODUCT=/tmp/p PRODUCT_NAME=p SOURCES=/tmp/src PWD=$PWD \
            docker compose --env-file versions.env \
              -f docker-compose.yml -f .sources.generated.yml config >/dev/null
